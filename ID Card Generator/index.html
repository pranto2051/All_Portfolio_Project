<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student ID Card Generator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--pn:#fff;--tx:#15222f;--mu:#5d6b7a;--bd:#dbe3ec;--ac:#12304a;--ac2:#1f6fb2;--ok:#1a8f5a;--er:#c0392b;--wr:#b7791f}
[data-theme=dark]{--bg:#0e1520;--pn:#17212e;--tx:#e5ecf3;--mu:#93a3b5;--bd:#263446;--ac:#2f7fc4;--ac2:#5aa9ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;font-size:14px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--pn);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.brand img{width:32px;height:32px;object-fit:contain;border-radius:6px}
nav{display:flex;gap:6px;margin:0 auto}
nav a{padding:7px 14px;border-radius:8px;color:var(--mu);text-decoration:none;font-weight:600}
nav a:hover{background:var(--bg);color:var(--tx)}
.tools{display:flex;gap:6px}
.burger{display:none}
.ic,.btn{border:1px solid var(--bd);background:var(--pn);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:600;transition:transform .15s,background .15s}
.ic:hover,.btn:hover{transform:translateY(-1px);background:var(--bg)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.dng{color:var(--er)}
.btn.sm{padding:6px 9px}
main{max-width:1240px;margin:0 auto;padding:20px;display:grid;gap:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:16px}
.stat b{display:block;font-size:26px}.stat span{color:var(--mu)}
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,580px);gap:20px;align-items:start}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:0 6px 24px rgba(18,48,74,.07)}
.panel h2{margin:0 0 14px;font-size:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.lbl{font-weight:600;font-size:12px;color:var(--mu)}
input[type=text],input[type=url],input[type=date],input[type=email],input[type=tel],input[type=search],select,.fld input{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:9px;background:var(--bg)}
input[type=color]{width:100%;height:38px;padding:2px;border:1px solid var(--bd);border-radius:9px;background:var(--bg)}
.err{color:var(--er);font-size:12px;min-height:0}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between;margin-top:0}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--ac);color:#fff}
.prow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pth{width:64px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.drop{flex:1;min-width:180px;border:2px dashed var(--bd);border-radius:12px;padding:18px;text-align:center;color:var(--mu);cursor:pointer}
.drop.hot,.drop:hover{border-color:var(--ac2);background:var(--bg)}
.urlrow{display:flex;gap:8px;flex:1;min-width:200px}
#photoBox{margin-top:14px}
#previewHost{margin:14px 0;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.cw{width:100%;margin-bottom:12px}
.card{width:540px;height:340px;position:relative;overflow:hidden;background:var(--bg);color:var(--tx);border:1px solid rgba(0,0,0,.12);border-radius:var(--r);transform-origin:top left;font-family:Manrope,system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.card *{box-sizing:border-box}
.c-head{height:70px;background:var(--p);color:#fff;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:4px solid var(--s)}
.tpl-minimal .c-head{background:transparent;color:var(--p);border-bottom:2px solid var(--p)}
.tpl-modern .c-head{border-bottom:0;border-left:10px solid var(--s)}
.tpl-corporate .c-head{border-radius:0 0 40px 0}
.tpl-royal .c-head{justify-content:center;border-bottom:6px double var(--s)}
.tpl-royal .c-ht{align-items:center;text-align:center}
.tpl-emerald .c-head{border-bottom:0;border-radius:0 0 0 44px}
.tpl-crimson .c-head{border-bottom:0;padding-left:30px;box-shadow:inset 12px 0 0 var(--s)}
.tpl-ocean .c-head{background:linear-gradient(110deg,var(--p),var(--s));border-bottom:0}
.tpl-sunset .c-head{background:linear-gradient(110deg,var(--p),var(--s));border-bottom:0;border-radius:0 0 30px 30px}
.tpl-slate .c-head{height:62px;border-bottom:0;border-top:8px solid var(--s)}
.tpl-midnight .c-head{background:linear-gradient(90deg,var(--p),#1e293b);border-bottom:2px solid var(--s)}
.tpl-lavender .c-head{margin:10px 12px 0;border-radius:40px;height:58px;border-bottom:0}
.tpl-graphite .c-head{border-bottom:3px solid var(--s)}
.tpl-rose .c-head{border-bottom:0;border-radius:0 0 50% 50%/0 0 16px 16px}
.tpl-midnight .c-name,.tpl-graphite .c-name{color:var(--s)}
.card.portrait{width:340px;height:540px}
.card.portrait .c-head{height:auto!important;min-height:92px;flex-direction:column;justify-content:center;text-align:center;gap:6px;padding:12px 16px!important}
.card.portrait .c-ht{align-items:center}
.card.portrait .c-body{flex-direction:column;align-items:center;gap:8px;padding:14px 20px 0}
.card.portrait .c-photo{width:120px;height:148px}
.card.portrait.shape-circle .c-photo{width:140px;height:140px}
.card.portrait .c-info{width:100%}
.card.portrait .c-name{text-align:center;font-size:19px}
.card.portrait .c-addr{text-align:center}
.card.portrait .c-foot{height:128px;flex-direction:column;justify-content:center;gap:8px}
.card.portrait .c-meta{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
.card.portrait .c-bar{max-width:170px;height:46px}
.card.portrait .c-back{padding:18px 20px}
.card.portrait .sig{right:50%;transform:translateX(50%)}
.card.portrait{display:flex;flex-direction:column}
.card.portrait .c-head{flex:none;min-height:0;padding:10px 14px!important;gap:5px}
.card.portrait .c-logo{width:40px;height:40px}
.card.portrait .c-ht b{font-size:calc(15px*var(--k,1));line-height:1.2}
.card.portrait .c-ht small{font-size:10px}
.card.portrait .c-body{flex:1 1 0;min-height:0;overflow:hidden;padding:10px 18px 6px;gap:calc(8px*var(--k,1))}
.card.portrait .c-photo,.card.portrait.shape-circle .c-photo{width:auto;height:auto;max-width:100%;flex:0 1 150px;min-height:64px;aspect-ratio:4/5}
.card.portrait.shape-circle .c-photo{aspect-ratio:1/1}
.card.portrait .c-info{flex:none}
.card.portrait .c-name{font-size:calc(19px*var(--k,1))}
.card.portrait .c-grid{gap:calc(4px*var(--k,1)) 12px}
.card.portrait .c-grid dd{font-size:calc(12.5px*var(--k,1))}
.card.portrait .c-grid dt{font-size:calc(9px*var(--k,1))}
.card.portrait .c-foot{position:static;flex:none;height:auto;min-height:0;padding:8px 18px 12px}
.card.portrait .c-codes{flex-wrap:wrap;justify-content:center}
.card.portrait .c-back{flex:1}
.tpl-iubat{font-family:Arial,Helvetica,sans-serif;background-repeat:no-repeat}
.iu-brand{position:absolute;left:32px;top:58px;height:52px;display:flex;align-items:center;gap:8px}
.iu-brand img{height:50px;max-width:80px;object-fit:contain}
.iu-brand b{font:800 46px/1 Arial,Helvetica,sans-serif;color:#2a7a52;letter-spacing:1px}
.iu-photo{position:absolute;left:31px;top:126px;width:123px;height:140px;object-fit:cover;border:2px solid #34406b;border-radius:6px;background:#fff}
.iu-info{position:absolute;left:165px;right:28px;top:124px;color:var(--tx)}
.iu-name{font-weight:700;white-space:nowrap;line-height:1.15;text-transform:uppercase}
.iu-id{font-size:15px;font-weight:700;margin:3px 0 7px}
.iu-r{display:flex;justify-content:space-between;gap:8px;height:20px;line-height:19px;border-bottom:1px dotted #555;font-size:12px}
.iu-r span{text-transform:uppercase;font-weight:600;white-space:nowrap}.iu-r b{font-weight:500;white-space:nowrap}
.iu-bar{position:absolute;left:0;right:0;bottom:0;height:45px;background:var(--p);color:#fff;text-align:center;font-weight:700;font-size:20px;letter-spacing:5px;line-height:45px;border-radius:0 0 var(--r) var(--r)}
.iu-back{position:absolute;inset:0;padding:30px 30px 0;text-align:center;color:#111}
.iu-bar2{background:#111;color:#fff;font-weight:700;font-size:13px;line-height:20px;margin-bottom:5px}
.iu-n{font-weight:700;font-size:12.5px;line-height:1.25}
.iu-ad{font-size:10.5px;line-height:1.25;margin-top:4px}
.iu-ct{font-size:10px;margin-top:3px;padding-bottom:3px;border-bottom:1.5px solid #111;white-space:nowrap}
.iu-ac{font-size:10px;margin-top:5px}
.iu-qrw{position:absolute;left:36px;top:172px;text-align:left;font-size:8.5px}
.iu-qrw .c-qr{width:70px;height:70px;padding:0;margin-bottom:6px}
.iu-sig{position:absolute;left:380px;width:120px;top:236px;border-top:1px solid #111;font-size:10px;font-weight:600;letter-spacing:2px;padding-top:4px}
.iu-sn{position:absolute;right:40px;top:288px;font:13px 'Courier New',monospace;letter-spacing:1px}
.c-logo{width:46px;height:46px;border-radius:8px;background:#fff;object-fit:contain;display:flex;align-items:center;justify-content:center;font-weight:800;color:#12304a;font-size:22px}
.c-ht{display:flex;flex-direction:column;min-width:0}.c-ht b{font-size:18px;line-height:1.15}.c-ht small{opacity:.85;font-size:11px}
.c-body{display:flex;gap:16px;padding:14px 20px}
.c-photo{width:104px;height:130px;object-fit:cover;flex:none;border:3px solid var(--s);border-radius:8px;background:#fff}
.shape-circle .c-photo{border-radius:50%;width:116px;height:116px}.shape-square .c-photo{border-radius:0}
.c-info{min-width:0;flex:1}
.c-name{font-size:21px;font-weight:800;color:var(--p);line-height:1.15;margin-bottom:6px}
.tpl-dark .c-name{color:var(--s)}
.c-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin:0}
.c-grid div{border-bottom:1px dashed rgba(128,128,128,.4);padding-bottom:2px;min-width:0}
.c-grid dt{font-size:9px;opacity:.65;font-weight:600}.c-grid dd{margin:0;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-addr{font-size:11px;margin-top:6px;opacity:.85}
.c-foot{position:absolute;left:0;right:0;bottom:0;height:84px;padding:8px 20px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(128,128,128,.35)}
.c-meta{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:600}
.pill{background:var(--s);color:#fff;padding:2px 9px;border-radius:99px;width:max-content}
.ok{color:#1a8f5a}
.c-codes{display:flex;align-items:center;gap:12px}
.c-bar{height:52px;width:auto;max-width:210px;background:#fff;padding:3px;border-radius:4px}
.c-qr{width:66px;height:66px;background:#fff;padding:3px;border-radius:4px}
.c-qr img,.c-qr canvas{width:100%!important;height:100%!important;display:block}
.c-qr canvas{display:none!important}
.c-back{padding:16px 20px;font-size:12px;line-height:1.5}
.c-back .t{font-weight:700}
.c-back p{margin:0 0 8px}
.sig{position:absolute;right:24px;bottom:24px;width:170px;border-top:1px solid currentColor;text-align:center;font-size:10px;padding-top:3px}
.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:rotate(-25deg);font-size:34px;font-weight:800;white-space:nowrap;color:var(--p);pointer-events:none;z-index:2}
#stage{position:fixed;left:-10000px;top:0}
#printArea{display:none}
.mgr-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.mgr-bar input[type=search]{max-width:240px}.mgr-bar select{width:auto}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.sc{display:flex;gap:10px;border:1px solid var(--bd);border-radius:12px;padding:12px;background:var(--bg);transition:box-shadow .15s}
.sc:hover{box-shadow:0 4px 14px rgba(0,0,0,.1)}.sc.on{border-color:var(--ac2)}
.sc img{width:48px;height:58px;object-fit:cover;border-radius:6px}
.sc .m{flex:1;min-width:0}.sc .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sc .m span{color:var(--mu);font-size:12px}
.acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.empty{text-align:center;padding:40px 10px;color:var(--mu)}.empty h3{color:var(--tx);margin:0 0 6px}
.ov{position:fixed;inset:0;background:rgba(10,20,30,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;animation:fd .15s}
.mbox{background:var(--pn);border-radius:16px;width:min(460px,100%);max-height:92vh;display:flex;flex-direction:column;animation:pop .18s}
.mbox.wide{width:min(720px,100%)}
.mh,.mf{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;gap:8px}.mh h3{margin:0}.mf{justify-content:flex-end;border-top:1px solid var(--bd)}
.mb{padding:16px 18px;overflow:auto}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}.tab{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mu)}.tab.on{background:var(--ac);color:#fff}
.tg{display:flex;gap:8px;align-items:center;padding:5px 0}
.tpls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
#toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--pn);border:1px solid var(--bd);border-left:4px solid var(--ac2);padding:11px 15px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:sl .25s;max-width:340px}
.toast.success{border-left-color:var(--ok)}.toast.error{border-left-color:var(--er)}.toast.warning{border-left-color:var(--wr)}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;display:none;align-items:center;justify-content:center;color:#fff;font-weight:700}
#busy.on{display:flex}#busy i{margin-right:10px}
@keyframes fd{from{opacity:0}}@keyframes pop{from{transform:scale(.96);opacity:0}}@keyframes sl{from{transform:translateY(12px);opacity:0}}
@media(max-width:900px){.work{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.burger{display:block;margin-left:auto}nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--pn);flex-direction:column;padding:10px;border-bottom:1px solid var(--bd)}nav.on{display:flex}.tools{margin-left:0}.top{flex-wrap:wrap}}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}.btn.pri,.row .btn{flex:1}#toasts{left:12px;right:12px;align-items:center}.mbox{max-height:100vh;height:100%;border-radius:0}.ov{padding:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@page{margin:10mm}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body>*:not(#printArea){display:none!important}#printArea{display:flex;flex-wrap:wrap;gap:6mm}body{background:#fff}.pc{width:85.6mm;height:53.98mm;overflow:hidden;break-inside:avoid;outline:.2mm dashed #aaa}.pc .card{transform:scale(.599);box-shadow:none}.pc.pp{width:53.98mm;height:85.6mm}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img id="hLogo" alt="" hidden><i class="fa-solid fa-id-card" id="hIcon"></i><span id="hName"></span></div>
  <button class="ic burger" id="burger" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
  <nav id="nav"><a href="#dash">Dashboard</a><a href="#work">Student cards</a><a href="#mgr">Manager</a><a href="#" id="navSet">Settings</a></nav>
  <div class="tools">
    <button class="ic" id="themeBtn" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
    <button class="ic" id="setBtn" aria-label="Settings"><i class="fa-solid fa-gear"></i></button>
    <button class="ic" id="resetBtn" aria-label="Reset all data"><i class="fa-solid fa-rotate-left"></i></button>
  </div>
</header>
<main>
  <section id="dash" class="stats" aria-label="Statistics"></section>
  <section id="work" class="work">
    <div class="panel">
      <h2><i class="fa-solid fa-id-card"></i> Student details</h2>
      <div id="form" class="fgrid"></div>
      <div id="photoBox"></div>
      <div class="row">
        <button class="btn pri" id="genBtn"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate ID card</button>
        <button class="btn" id="newBtn"><i class="fa-solid fa-plus"></i> Add new card</button>
      </div>
    </div>
    <div class="panel">
      <div class="row between"><h2>Live preview</h2>
        <div class="row" style="margin:0"><div class="seg" id="orientSeg" role="group" aria-label="Card layout"></div><div class="seg" id="viewSeg" role="group" aria-label="Card side"></div></div></div>
      <div id="previewHost"></div>
      <div class="tpls" id="quickTpl"></div>
      <div class="row">
        <button class="btn" id="pPng"><i class="fa-solid fa-image"></i> Download PNG</button>
        <button class="btn" id="pPdf"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>
        <button class="btn" id="pPrint"><i class="fa-solid fa-print"></i> Print</button>
      </div>
    </div>
  </section>
  <section id="mgr" class="panel">
    <h2>Student cards</h2>
    <div class="mgr-bar">
      <input type="search" id="q" placeholder="Search name, ID, roll, class, department" aria-label="Search students">
      <select id="fCls" aria-label="Filter by class"></select>
      <select id="sort" aria-label="Sort"><option value="recent">Recently added</option><option value="az">Name A-Z</option><option value="za">Name Z-A</option><option value="id">Student ID</option></select>
      <label class="tg"><input type="checkbox" id="selAll"> Select all</label>
    </div>
    <div class="mgr-bar">
      <select id="perPage" aria-label="Cards per A4 page"><option value="1">1 card / page</option><option value="2">2 cards / page</option><option value="4">4 cards / page</option><option value="8">8 cards / page</option></select>
      <select id="orient" aria-label="Orientation"><option value="portrait">A4 portrait</option><option value="landscape">A4 landscape</option></select>
      <label class="tg"><input type="checkbox" id="inclBack"> Include back side</label>
      <button class="btn pri" id="bPdf"></button>
      <button class="btn" id="bPrint"><i class="fa-solid fa-print"></i> Print</button>
      <button class="btn" id="bCsv"><i class="fa-solid fa-file-csv"></i> Import CSV</button>
      <button class="btn" id="bSave"><i class="fa-solid fa-floppy-disk"></i> Save all</button>
      <button class="btn dng" id="bClear"><i class="fa-solid fa-trash"></i> Clear all</button>
    </div>
    <div id="list" class="list"></div>
  </section>
</main>
<div id="toasts" aria-live="polite"></div>
<div id="busy"><i class="fa-solid fa-spinner fa-spin"></i> Working…</div>
<div id="stage"></div><div id="printArea"></div>
<input type="file" id="csvIn" accept=".csv,text/csv" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script>
"use strict";
/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

/* ---------- Export ---------- */
const libsOk=()=>{if(window.html2canvas&&window.jspdf)return true;toast('Export libraries did not load. Check your internet connection and reload.','error');return false};
async function capture(st,side,scale){const c=buildCard(st,side);c.style.boxShadow='none';$('#stage').append(c);await new Promise(r=>setTimeout(r,80));try{return await html2canvas(c,{scale,backgroundColor:null,useCORS:true})}finally{c.remove()}}
function dl(url,name){const a=h('a',{href:url,download:name});document.body.append(a);a.click();a.remove()}
function markExported(list){list.forEach(s=>{const r=S.students.find(x=>x.uid===s.uid);if(r)r.exported=1});persist();renderStats()}
async function exportPNG(st){if(!libsOk())return;busy(true);try{dl((await capture(st,'front',4)).toDataURL('image/png'),safe(st.id)+'-front.png');
  if(S.prefs.back)dl((await capture(st,'back',4)).toDataURL('image/png'),safe(st.id)+'-back.png');markExported([st]);toast('PNG downloaded')}catch(e){toast('PNG export failed. If the photo came from a URL, upload it as a file.','error')}busy(false)}
const GRIDP={portrait:{1:[1,1],2:[2,1],4:[2,2],8:[3,3]},landscape:{1:[1,1],2:[2,1],4:[2,2],8:[4,2]}};
const GRID={portrait:{1:[1,1],2:[1,2],4:[2,2],8:[2,4]},landscape:{1:[1,1],2:[2,1],4:[2,2],8:[3,3]}};
async function exportPDF(list,mode){if(!libsOk()||!list.length)return;busy(true);
 try{const pt=S.design.orient==='portrait',W=pt?53.98:85.6,H=pt?85.6:53.98,imgs=[];
  for(const st of list){imgs.push((await capture(st,'front',3)).toDataURL('image/jpeg',.95));if(S.prefs.back||(mode==='card'&&false))imgs.push((await capture(st,'back',3)).toDataURL('image/jpeg',.95))}
  const {jsPDF}=window.jspdf;let pdf;
  if(mode==='card'){pdf=new jsPDF({orientation:pt?'portrait':'landscape',unit:'mm',format:[W,H]});imgs.forEach((im,i)=>{if(i)pdf.addPage([W,H],pt?'portrait':'landscape');pdf.addImage(im,'JPEG',0,0,W,H)})}
  else{const land=S.prefs.orient==='landscape',pw=land?297:210,ph=land?210:297,per=+S.prefs.per,[cols,rows]=(pt?GRIDP:GRID)[S.prefs.orient][per],gap=6;
   const gw=cols*W+(cols-1)*gap,rr=Math.ceil(per/cols),gh=Math.min(rows,rr)*H+(Math.min(rows,rr)-1)*gap,x0=(pw-gw)/2,y0=(ph-gh)/2;
   pdf=new jsPDF({orientation:S.prefs.orient,unit:'mm',format:'a4'});pdf.setDrawColor(150);pdf.setLineWidth(.1);
   imgs.forEach((im,i)=>{if(i&&i%per===0)pdf.addPage();const p=i%per,x=x0+(p%cols)*(W+gap),y=y0+Math.floor(p/cols)*(H+gap);pdf.addImage(im,'JPEG',x,y,W,H);if(per>1)pdf.rect(x,y,W,H)})}
  pdf.save(list.length===1?safe(list[0].id)+'.pdf':'student-id-cards.pdf');markExported(list);toast('PDF generated')}
 catch(e){toast('PDF export failed. If photos came from a URL, upload them as files.','error')}busy(false)}
function printCards(list){if(!list.length)return;const pa=$('#printArea');pa.replaceChildren();
 list.forEach(st=>['front',...(S.prefs.back?['back']:[])].forEach(sd=>pa.append(h('div',{class:'pc'+(S.design.orient==='portrait'?' pp':'')},buildCard(st,sd)))));setTimeout(()=>window.print(),200)}
window.addEventListener('afterprint',()=>$('#printArea').replaceChildren());
const target=()=>sel.size?S.students.filter(s=>sel.has(s.uid)):visible();

/* ---------- CSV / JSON ---------- */
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===','){r.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else f+=c}
 r.push(f);if(r.some(x=>x.trim()))rows.push(r);return rows}
const CSVMAP={name:'name',studentname:'name',id:'id',studentid:'id',roll:'roll',reg:'reg',registration:'reg',class:'cls',cls:'cls',section:'section',department:'dept',dept:'dept',session:'session',bloodgroup:'blood',blood:'blood',dob:'dob',dateofbirth:'dob',gender:'gender',phone:'phone',email:'email',address:'address',guardian:'guardian',guardianphone:'gphone',admission:'admission',expiry:'expiry'};
function importCSV(text){try{const rows=parseCSV(text);if(rows.length<2)throw 0;const keys=rows[0].map(x=>CSVMAP[x.toLowerCase().replace(/[^a-z]/g,'')]);
  if(!keys.includes('name')||!keys.includes('id'))throw 0;let add=0,skip=0;
  rows.slice(1).forEach(r=>{const s={...blank(),uid:uid(),id:'',session:'',created:Date.now()+add};keys.forEach((k,i)=>{if(k)s[k]=(r[i]||'').trim()});
   if(!s.name||!s.id||S.students.some(x=>x.id.toLowerCase()===s.id.toLowerCase())){skip++;return}S.students.push(s);add++});
  persist();renderAll();toast(add+' students imported'+(skip?', '+skip+' skipped (missing or duplicate ID)':''),skip?'warning':'success')}
 catch(e){toast('Invalid CSV. The first row must include at least "name" and "id" columns.','error')}}
function exportData(){const b=new Blob([JSON.stringify({inst:S.inst,design:S.design,students:S.students},null,1)],{type:'application/json'});const u=URL.createObjectURL(b);dl(u,'id-card-data.json');setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Data exported')}
function importData(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.students))throw 0;
  confirmBox('Replace all current data with the imported file?',()=>{S.inst={...DEF_INST,...d.inst};S.design={...DEF_DESIGN,...d.design,show:{...DEF_DESIGN.show,...((d.design||{}).show||{})}};S.students=d.students.map(s=>({...s,uid:s.uid||uid()}));persist();draft=blank();buildForm();renderPhoto();renderAll();toast('Data imported')},'Replace')}
 catch(e){toast('Invalid JSON file. Use a file created by Export data.','error')}};r.onerror=()=>toast('The file could not be read.','error');r.readAsText(file)}

  design:()=>{const t=h('div',{class:'tpls'},Object.entries(TPL).map(([k,v])=>btn(v.n,d.template===k?'pri':'',()=>{Object.assign(d,{template:k,p:v.p,s:v.s,bg:v.bg,tx:v.tx});if(v.show)Object.assign(d.show,v.show);renderPreview();show('design')})));

    h('div',{style:'margin-top:12px'},tog('Show watermark',d,'wm','t_wm')),h('div',{class:'fgrid'},fld('Watermark text',d,'wmText'),fld('Watermark opacity',d,'wmOp','range',{min:.03,max:.3,step:.01})))},

  data:()=>{const ji=h('input',{type:'file',accept:'application/json,.json',hidden:''});ji.onchange=()=>ji.files[0]&&importData(ji.files[0]);
   return h('div',{},h('p',{text:'Everything is stored only in this browser. Export a backup to move your data to another computer.'}),h('div',{class:'row'},btn('Export data (JSON)','',exportData),btn('Import data (JSON)','',()=>ji.click()),ji,btn('Clear all students','dng',clearAll)))}};
 const T=[['inst','Institution'],['design','Card design'],['fields','Fields'],['data','Data']];
 function show(t){tabs.replaceChildren(...T.map(([k,l])=>h('button',{class:'tab'+(k===t?' on':''),role:'tab',onclick:()=>show(k)},l)));body.replaceChildren(panes[t]())}
 show(tab);let close;close=modal({title:'Settings',wide:true,body:h('div',{},tabs,body),actions:[btn('Close','',()=>close()),btn('Save settings','pri',()=>{persist();toast('Settings saved')})]})}
