}
:root{--csh:0 14px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,225,190,.25),inset 0 -2px 6px rgba(0,0,0,.45);--bsh:inset 0 2px 5px rgba(0,0,0,.65),0 1px 0 var(--hi),0 0 0 1px rgba(0,0,0,.25);--psh:inset 0 6px 14px rgba(0,0,0,.7)}
html[data-shadow=inner]{--csh:inset 0 6px 16px rgba(0,0,0,.7),inset 0 -1px 0 var(--hi),0 1px 0 var(--hi);--bsh:inset 0 4px 9px rgba(0,0,0,.85),0 1px 0 var(--hi);--psh:inset 0 10px 22px rgba(0,0,0,.85);--sheen:.05}
html[data-shadow=outer]{--csh:0 22px 40px rgba(0,0,0,.6),0 6px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,235,210,.35),inset 0 -5px 10px rgba(0,0,0,.45);--bsh:0 5px 10px rgba(0,0,0,.55),inset 0 1px 0 var(--hi),inset 0 -2px 4px rgba(0,0,0,.4);--psh:0 10px 20px rgba(0,0,0,.65),inset 0 2px 0 var(--hi);--sheen:.22}

*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:clip}
body{font:600 16px/1.7 Georgia,"Noto Serif Bengali","Nirmala UI","Kohinoor Bangla",serif;color:var(--bt);background:var(--grain-img),radial-gradient(1200px 700px at 50% 0,var(--leather-l),var(--leather) 45%,var(--leather-d));background-attachment:fixed}
h1,h2,h3,p,li,small{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:var(--tf)}
li::marker{color:var(--bt)}
h1,h2,h3{font-weight:800;letter-spacing:.04em;margin:0 0 .4em;text-transform:uppercase}
h1{font-size:clamp(2rem,5.6vw,3.8rem);line-height:1.06}h2{font-size:clamp(1.4rem,3.2vw,2.1rem)}h3{font-size:1.05rem}
p{margin:.3em 0}a{color:inherit}small{font-weight:700;letter-spacing:.06em}
.card{position:relative;border-radius:30px;padding:32px 30px;background:var(--grain-img),linear-gradient(150deg,rgba(255,200,160,var(--sheen)),transparent 40%,rgba(0,0,0,.2)),var(--leather);box-shadow:var(--csh)}
.card::before{content:"";position:absolute;inset:10px;border-radius:21px;pointer-events:none;border:2px dashed var(--stitch);opacity:.85;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.card>*{position:relative}
.btn,.pill,.stat{color:var(--bt);text-shadow:var(--bts)}
.btn{cursor:pointer;font:800 .8rem Georgia,"Noto Serif Bengali","Nirmala UI","Kohinoor Bangla",serif;letter-spacing:.08em;text-transform:uppercase;padding:9px 18px;border-radius:999px;border:0;text-decoration:none;display:inline-block;background:var(--grain-img),var(--leather-d);box-shadow:var(--bsh)}
.btn[aria-pressed=true],.pager .btn[aria-current=true]{box-shadow:inset 0 4px 9px rgba(0,0,0,.85),0 0 0 2px var(--stitch);color:var(--acc)}
/* top floating strap menu (bottom bar on small screens) */
#rail{position:fixed;top:12px;left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100% - 20px);z-index:30;display:flex;align-items:center;gap:4px;padding:8px 14px;border-radius:999px}
#rail::before{inset:4px;border-radius:999px}
#rail a,#rail button{display:flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;text-decoration:none;border:0;background:none;cursor:pointer;font:800 .74rem Georgia,"Noto Serif Bengali","Nirmala UI","Kohinoor Bangla",serif;letter-spacing:.08em;text-transform:uppercase;color:var(--bt);text-shadow:var(--bts)}
#rail a b{display:none}#rail b{font-size:1rem}
#rail a.on{background:var(--leather-d);box-shadow:inset 0 3px 8px rgba(0,0,0,.75),0 0 0 2px var(--stitch);color:var(--acc)}
#rail .mono{font:800 1.15rem Georgia,"Noto Serif Bengali","Nirmala UI","Kohinoor Bangla",serif;padding:0 14px 0 6px;margin-right:6px;color:var(--bt);text-shadow:var(--bts);border-right:2px dashed var(--stitch)}
main{max-width:100%;padding-top:84px}.wrap{width:min(1080px,94%);margin:0 auto;padding-bottom:70px}
section{padding-top:64px;scroll-margin-top:84px}#about{padding-top:20px}
.sh{text-align:center;margin-bottom:30px}.sh small{display:block;margin-bottom:2px}
h2.u::after{content:"";display:block;margin:10px auto 0;border-top:2px dashed var(--stitch);opacity:.85;width:120px}
.head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:30px}.head .sh{margin:0}.head>div:last-child{text-align:right}
/* hero medallion */
.hero{display:grid;grid-template-columns:330px 1fr;gap:34px;align-items:center;padding:42px 38px}
.medal{padding:14px;text-align:center}
.disc{width:min(260px,100%);aspect-ratio:1;margin:0 auto;border-radius:50%;position:relative;overflow:hidden;display:grid;place-items:center;font:800 4.4rem Georgia,"Noto Serif Bengali","Nirmala UI","Kohinoor Bangla",serif;color:var(--bt);text-shadow:var(--bts);
  background:var(--grain-img),var(--leather-d);box-shadow:var(--psh),0 0 0 6px var(--leather),0 0 0 9px var(--stitch),0 0 0 14px var(--leather-d)}
.disc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.ribbon{display:inline-block;margin-top:30px;padding:9px 34px;font:800 .8rem Georgia,"Noto Serif Bengali","Nirmala UI","Kohinoor Bangla",serif;letter-spacing:.06em;text-transform:uppercase;color:var(--bt);text-shadow:var(--bts);
  background:var(--grain-img),var(--leather-d);clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%)}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.pill{padding:5px 14px;border-radius:999px;font-size:.8rem;background:var(--leather-d);box-shadow:var(--bsh)}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.stat{flex:1 1 100px;padding:14px 8px;border-radius:24px;text-align:center;background:var(--leather-d);box-shadow:var(--bsh);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.stat b{display:block;font-size:1.7rem;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:24px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr))}
.sk0{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chips .pill{border-radius:16px;padding:7px 14px}
/* zig-zag timeline */
.tl{position:relative;display:grid;gap:26px}
.tl::before{content:"";position:absolute;left:50%;top:8px;bottom:8px;border-left:3px dashed var(--stitch)}
.ti{position:relative;width:calc(50% - 34px)}.ti:nth-child(even){margin-left:auto}
.ti::before{content:"";position:absolute;top:28px;right:-44px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--acc),var(--stitch));box-shadow:0 2px 4px rgba(0,0,0,.6),0 0 0 3px var(--leather-d)}
.ti:nth-child(even)::before{right:auto;left:-44px}
/* project cards & certificate badges */
.tile{cursor:pointer;padding:0;overflow:hidden}
.tile .ph{position:relative;height:230px;display:grid;place-items:center;background-size:cover;background-position:center;box-shadow:inset 0 -40px 50px rgba(0,0,0,.35)}
.ch{font:800 3rem Georgia,"Noto Serif Bengali","Nirmala UI","Kohinoor Bangla",serif;color:var(--bt);text-shadow:var(--bts)}
.no{position:absolute;top:16px;left:16px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 .85rem Georgia,"Noto Serif Bengali","Nirmala UI","Kohinoor Bangla",serif;color:#2a1806;background:radial-gradient(circle at 35% 30%,var(--acc),var(--stitch));box-shadow:0 2px 4px rgba(0,0,0,.6)}
.tile .cap{margin:-38px 16px 16px;padding:16px 20px;border-radius:22px;background:var(--grain-img),var(--leather);box-shadow:0 10px 20px rgba(0,0,0,.5),inset 0 1px 0 var(--hi)}
.tile.badge .ph{width:120px;height:120px;border-radius:50%;margin:32px auto 0;box-shadow:var(--psh),0 0 0 4px var(--leather),0 0 0 6px var(--stitch)}
.tile.badge .cap{margin:0;padding:16px 24px 28px;background:none;box-shadow:none;text-align:center}
.tile:focus-visible{outline:3px solid var(--stitch);outline-offset:3px}
.pager{display:flex;justify-content:center;gap:10px;margin-top:28px;flex-wrap:wrap}
form{display:grid;gap:12px}
input,textarea{width:100%;padding:12px 16px;border-radius:16px;border:0;font:600 1rem Georgia,"Noto Serif Bengali","Nirmala UI","Kohinoor Bangla",serif;color:var(--bt);background:var(--grain-img),var(--leather-d);box-shadow:var(--bsh)}
::placeholder{color:var(--bt);opacity:.6}
.soc{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}footer{text-align:center;padding:0 0 40px}
/* overlays: overlay scrolls, so stitching moves with the card */
#pop,#set{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;background:rgba(15,5,2,.72)}
#pop.on,#set.on{display:flex}
#pop .card,#set .card{width:min(860px,100%);margin:auto;padding:0}#set .card{padding:30px;width:min(660px,100%)}
.pg{display:grid;grid-template-columns:1fr 1.15fr}
#pim{min-height:320px;display:grid;place-items:center;font:800 3rem Georgia,"Noto Serif Bengali","Nirmala UI","Kohinoor Bangla",serif;color:var(--bt);background-size:cover;background-position:center;border-radius:30px 0 0 30px;box-shadow:inset -8px 0 18px rgba(0,0,0,.5)}
#pop .tx{padding:32px 32px 32px 28px}#pop ul{padding-left:20px;margin:.4em 0}
#x,#sx{position:absolute;top:16px;right:16px;z-index:3}
#set h3{margin-top:18px}.opt{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.sw button{cursor:pointer;border:0;border-radius:14px;padding:8px;font:700 .7rem Georgia,"Noto Serif Bengali","Nirmala UI","Kohinoor Bangla",serif;color:var(--bt);background:var(--leather-d);box-shadow:var(--bsh)}
.sw i{display:block;height:28px;border-radius:8px;margin-bottom:6px}.sw button[aria-pressed=true]{outline:3px solid var(--stitch)}
html[data-anim=on] :is(h1,h2,h3,p,li,small){background-size:250% 100%;animation:shn 4.5s ease-in-out infinite alternate}
@keyframes shn{from{background-position:0% 0}to{background-position:100% 0}}
html[lang=bn] *{letter-spacing:0!important}
h1,h2,h3,p,li,small,.pill,.btn,.stat,.sw button,#rail a,#rail button{overflow-wrap:anywhere;word-break:break-word}
.grid>*,.hero>*,.tile>*,.stat,.pill{min-width:0}
.pill,.btn{max-width:100%;white-space:normal;text-align:center}.chips .pill{text-align:left}
@media(max-width:960px){
  #rail{top:auto;bottom:8px;width:calc(100% - 16px);max-width:560px;padding:6px 8px;gap:0;justify-content:space-between;border-radius:26px}#rail::before{border-radius:21px}
  #rail .mono{display:none}
  #rail a,#rail button{flex-direction:column;gap:0;padding:6px 2px;flex:1 1 0;min-width:0;font-size:.58rem;letter-spacing:0;text-align:center;border-radius:18px}
  #rail a b{display:block;font-size:.85rem}
  main{padding-top:16px}.wrap{padding-bottom:100px}section{scroll-margin-top:16px}
  .hero{grid-template-columns:1fr;text-align:center;padding:34px 22px}.hero .pills{justify-content:center}
  .pg{grid-template-columns:1fr}#pim{border-radius:30px 30px 0 0;min-height:220px}
  .tl{padding-left:38px}.tl::before{left:10px}.ti,.ti:nth-child(even){width:100%;margin-left:0}

#pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:700px){#pgrid{grid-template-columns:1fr}}
@media(max-width:640px){.head{grid-template-columns:1fr}.head>span{display:none}.head>div:last-child{text-align:center;margin-top:14px}}
@media(max-width:480px){h1{font-size:1.8rem}.card{padding:26px 18px}.card::before{inset:7px;border-radius:23px}.hero{padding:28px 16px}.stat{font-size:.6rem;padding:10px 3px;flex-basis:84px}.stat b{font-size:1.35rem}
  .tile .ph{height:190px}.tile .cap{margin:-32px 12px 12px;padding:14px 16px}.tl{padding-left:32px}.ti::before,.ti:nth-child(even)::before{left:-32px}
  #set .card{padding:24px 16px}#pop .tx{padding:24px 18px}.sw{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}.ribbon{padding:8px 26px}}
</style>

const DEF={surface:"leather",mode:"night",theme:0,text:0,shine:"on",stype:"part",anim:"off",shadow:"default",lang:"en"};

if(!THEMES[ST.theme])ST.theme=0;if(!TEXTS[ST.text])ST.text=0;

const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("")};
function applySet(){
  const [,d,m,l]=THEMES[ST.theme],X=TEXTS[ST.text],r=document.documentElement,v=(k,x)=>r.style.setProperty(k,x),night=ST.mode==="night",mt=ST.surface==="matte"?.55:1;
  const hiS="rgba(255,255,255,"+(night?.14:.4)*mt+")",loS="rgba(0,0,0,"+(night?.75:.45)*mt+")";
  v("--hi",hiS);v("--lo",loS);
  if(night){v("--leather",mix(m,"#000000",.5));v("--leather-l",mix(m,"#000000",.3));v("--leather-d",mix(d,"#000000",.4))}
  else{v("--leather",mix(m,"#ffffff",.5));v("--leather-l",mix(m,"#ffffff",.62));v("--leather-d",mix(m,"#ffffff",.35))}
  const ink=night?mix(l,"#ffffff",.35):mix(d,"#000000",.5);v("--ink",ink);
  const A=X[1]?[X[1],X[2],X[3]].map((c,i)=>night?c:mix(c,"#000000",[.35,.5,.65][i])):null;
  const flat=ST.shine==="off",full=!!A&&!flat&&ST.stype==="full";
  v("--foil",A?(flat?`linear-gradient(${A[1]},${A[1]})`:full?`linear-gradient(180deg,${A[0]} 0%,${A[1]} 55%,${A[0]} 100%)`:`linear-gradient(110deg,${A[2]} 0%,${A[1]} 20%,${A[0]} 34%,${A[1]} 50%,${A[2]} 66%,${A[1]} 82%,${A[0]} 100%)`):`linear-gradient(${ink},${ink})`);
  v("--bt",A?A[1]:ink);v("--stitch",A?A[1]:(night?mix(l,"#ffffff",.2):mix(d,m,.35)));v("--acc",A?(night?A[0]:A[2]):(night?mix(l,"#ffffff",.6):d));
  let tf,bts;
  if(ST.shadow==="inner"){tf=`drop-shadow(0 -1px 0 rgba(0,0,0,.8)) drop-shadow(0 1px 0 ${hiS})`;bts=`0 -1px 0 rgba(0,0,0,.8),0 1px 0 ${hiS}`}
  else if(ST.shadow==="outer"){tf=`drop-shadow(0 2px 2px rgba(0,0,0,.75)) drop-shadow(0 -1px 0 ${hiS})`;bts=`0 2px 2px rgba(0,0,0,.7),0 -1px 0 ${hiS}`}
  else if(A){tf=`drop-shadow(0 1px 0 rgba(0,0,0,${night?.7:.35})) drop-shadow(0 0 1px rgba(0,0,0,.3))`;bts=`0 1px 1px rgba(0,0,0,${night?.8:.3})`}
  else{tf=`drop-shadow(0 1px 0 ${hiS}) drop-shadow(0 -1px 1px ${loS})`;bts=`0 1px 0 ${hiS},0 -1px 1px ${loS}`}
  if(full)tf+=` drop-shadow(0 0 5px ${A[1]}${night?"88":"55"})`;

  drawSet();
}
function drawSet(){
  const o=(id,arr,key)=>{$(id).innerHTML=arr.map(([v,n])=>`<button class="btn" type="button" data-k="${key}" data-v="${v}" aria-pressed="${String(ST[key])===String(v)}">${n}</button>`).join("")};
  const onoff=[["on",T("on")],["off",T("off")]];
  o("#o-surface",[["leather",T("leather")],["matte",T("matte")]],"surface");o("#o-mode",[["day",T("day")],["night",T("night")]],"mode");
  o("#o-text",TEXTS.map((t,i)=>[i,T("t"+i)]),"text");o("#o-shine",onoff,"shine");o("#o-stype",[["part",T("st_part")],["full",T("st_full")]],"stype");o("#o-anim",onoff,"anim");
  o("#o-shadow",[["default",T("sh_def")],["inner",T("sh_in")],["outer",T("sh_out")]],"shadow");o("#o-lang",[["bn","বাংলা"],["en","English"]],"lang");

const setEl=$("#set"),pop=$("#pop");
$("#gear").onclick=()=>{setEl.classList.add("on");document.body.style.overflow="hidden";$("#sx").focus()};

setEl.addEventListener("click",e=>{

  const b=e.target.closest("button");if(!b)return;

});

function cardHTML(o,k,i){
  const row=k==="c";
  return `<article class="card tile${row?" badge":""}" tabindex="0" data-k="${k}" data-i="${i}"><div class="ph" style="${bgOf(o)}">${row?"":`<span class="no">${String(i+1).padStart(2,"0")}</span>`}<span class="ch">${o.img?"":esc(o.t[0])}</span></div><div class="cap"><h3>${esc(o.t)}</h3><p>${esc(o.s)}</p></div></article>`;
}
let page=0;const pages=()=>Math.max(1,Math.ceil(PROJECTS.length/PER));
function renderProjects(){
  $("#pgrid").innerHTML=PROJECTS.slice(page*PER,page*PER+PER).map((o,j)=>{const i=page*PER+j;return cardHTML(V(o,i,PROJECTS_BN),"p",i)}).join("");
  const n=pages();$("#ppager").innerHTML=n>1?Array.from({length:n},(_,i)=>`<button class="btn" type="button" data-p="${i}" ${i===page?'aria-current="true"':""}>${i+1}</button>`).join(""):"";
  $("#more").style.display=n>1?"":"none";$("#more").textContent=page>=n-1?T("back"):T("more");

function renderAll(){

  $("#cgrid").innerHTML=CERTS.map((o,i)=>cardHTML(V(o,i,CERTS_BN),"c",i)).join("");
  renderProjects();drawSet();
}
function applyLang(){
  document.documentElement.lang=bn()?"bn":"en";
  document.querySelectorAll("[data-i]").forEach(e=>{e.textContent=T(e.dataset.i)});
  document.querySelectorAll("[data-ph]").forEach(e=>{e.placeholder=T(e.dataset.ph)});
  renderAll();
}
$("#more").onclick=()=>{page=page>=pages()-1?0:page+1;renderProjects()};
$("#ppager").onclick=e=>{const b=e.target.closest("[data-p]");if(b){page=+b.dataset.p;renderProjects()}};
function open(k,i){
  const o=k==="p"?V(PROJECTS[i],i,PROJECTS_BN):V(CERTS[i],i,CERTS_BN);
  $("#pim").style.cssText=bgOf(o);$("#pim").textContent=o.img?"":o.t[0];
  $("#pt").textContent=o.t;$("#pm").textContent=o.m;
  let h="",ul=false;
  o.d.split("\n").forEach(l=>{if(l.startsWith("- ")){if(!ul){h+="<ul>";ul=true}h+=`<li>${esc(l.slice(2))}</li>`}else{if(ul){h+="</ul>";ul=false}h+=`<p>${esc(l)}</p>`}});
  $("#pd").innerHTML=h+(ul?"</ul>":"");$("#ptag").innerHTML=o.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join("");

function close(){pop.classList.remove("on");document.body.style.overflow=""}
document.addEventListener("click",e=>{const c=e.target.closest(".tile");if(c)open(c.dataset.k,+c.dataset.i)});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){close();closeSet()}

/* active menu item follows the section on screen */
const links=[...document.querySelectorAll("#rail a")],secs=links.map(a=>document.getElementById(a.dataset.s));
function spy(){
  let cur=0;secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<=innerHeight*.4)cur=i});
  if(innerHeight+scrollY>=document.documentElement.scrollHeight-4)cur=secs.length-1;

links.forEach(a=>a.addEventListener("click",()=>{links.forEach(x=>x.classList.toggle("on",x===a))}));
