<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MD. Pranto Islam – Portfolio</title>
<style>
:root{--a1:#0a84ff;--a2:#bf5af2;--a3:#ff375f;--blur:28px;--frost:.45;--g:255 255 255;--tx:#1d1d1f;--tx2:#5c5c63;--bg:#cfe3ff;--line:rgb(255 255 255/.45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--g:30 30 36;--tx:#f5f5f7;--tx2:#a1a1aa;--bg:#0b0b14;--line:rgb(255 255 255/.14)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:14px/1.5 -apple-system,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
.wall{position:fixed;inset:0;background:radial-gradient(60% 50% at 15% 20%,var(--a1),transparent 70%),radial-gradient(55% 55% at 85% 25%,var(--a2),transparent 70%),radial-gradient(60% 60% at 60% 95%,var(--a3),transparent 70%),var(--bg);opacity:.85;transition:.6s}
:root[data-theme="dark"] .wall{opacity:.55}
.glass{background:linear-gradient(135deg,rgb(var(--g)/calc(var(--frost) + .15)),rgb(var(--g)/var(--frost)));-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgb(255 255 255/.5),0 18px 50px rgb(0 0 0/.22)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
/* boot */
#boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:#000;color:#fff;transition:opacity .8s,visibility .8s}
#boot.off{opacity:0;visibility:hidden}
#boot .bg{position:absolute;inset:0;background:radial-gradient(50% 40% at 50% 40%,rgb(10 132 255/.35),transparent 70%)}
#boot>*{position:relative}
.av{width:132px;height:132px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2) 55%,var(--a3));background-size:cover;background-position:center 20%;display:grid;place-items:center;font-size:54px;font-weight:700;color:#fff;border:3px solid rgb(255 255 255/.6);box-shadow:0 0 0 8px rgb(255 255 255/.1),0 20px 60px rgb(10 132 255/.5);animation:pop 1s cubic-bezier(.2,1.4,.4,1)}
.av.has{color:transparent}
@keyframes pop{from{transform:scale(.4);opacity:0}}
#boot h1{font-size:30px;font-weight:700;letter-spacing:-.5px}
#boot p{color:#c7c7d1}
.bar{width:180px;height:4px;border-radius:4px;background:rgb(255 255 255/.2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;animation:load 3s ease-out forwards}
@keyframes load{to{width:100%}}
#boot button{margin-top:6px;padding:8px 22px;border-radius:99px;background:rgb(255 255 255/.18);border:1px solid rgb(255 255 255/.35)}
/* menubar */
#menu{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:30px;z-index:50;display:flex;align-items:center;gap:4px;padding:0 10px;font-size:13px;border-radius:0;border-width:0 0 1px}
#menu .m{padding:2px 9px;border-radius:6px;white-space:nowrap}
#menu .m:hover,#menu .m.on{background:rgb(128 128 128/.25)}
#menu svg{width:15px;height:15px;fill:currentColor;display:block}
#menu .sp{flex:1}
#menu b{font-weight:700}
.dd{position:fixed;top:calc(32px + env(safe-area-inset-top,0px));left:8px;min-width:210px;padding:6px;border-radius:12px;z-index:60;display:none}
.dd.show{display:block}
.dd button{display:block;width:100%;text-align:left;padding:5px 10px;border-radius:6px}
.dd button:hover{background:var(--a1);color:#fff}
.dd hr{border:0;border-top:1px solid var(--line);margin:5px 0}
/* windows */
#desk{position:fixed;inset:30px 0 0;z-index:5}
.win{position:absolute;display:flex;flex-direction:column;border-radius:var(--r,16px);overflow:hidden;resize:both;min-width:300px;min-height:200px;animation:open .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes open{from{transform:scale(.85);opacity:0}}
.win.hide{display:none}
.tb{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;cursor:grab;user-select:none;border-bottom:1px solid var(--line)}
.tb span.t{flex:1;text-align:center;font-weight:600;font-size:13px;margin-right:46px}
.dot{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1px rgb(0 0 0/.15)}
.d1{background:#ff5f57}.d2{background:#febc2e}.d3{background:#28c840}
.body{flex:1;overflow:auto;padding:22px}
h2{font-size:26px;letter-spacing:-.5px;margin-bottom:6px}
.mut{color:var(--tx2)}
.btn{display:inline-block;padding:8px 18px;border-radius:99px;background:var(--a1);color:#fff;font-weight:600;margin:12px 8px 0 0;text-decoration:none}
.btn.o{background:rgb(128 128 128/.22);color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:14px}
.card{padding:14px;border-radius:14px;background:rgb(var(--g)/.35);border:1px solid var(--line)}
.card h4{font-size:15px;margin:6px 0 2px}
.chip{display:inline-block;margin:6px 6px 0 0;padding:4px 12px;border-radius:99px;background:rgb(128 128 128/.2);font-size:12.5px}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.row .av{width:96px;height:96px;font-size:40px;animation:none;flex:none}
.stat{text-align:center;flex:1;min-width:80px}.stat b{display:block;font-size:24px;color:var(--a1)}
.tl{border-left:2px solid var(--a1);padding-left:18px;margin-top:14px}
.tl div{margin-bottom:18px;position:relative}.tl div:before{content:"";position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--a1)}
.tl small{color:var(--a1);font-weight:700;letter-spacing:.5px}
.tl h3{font-size:17px}
a.card{display:block;color:inherit;text-decoration:none}
.set label{display:block;margin:14px 0 4px;font-weight:600}
.set input[type=text]{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:rgb(var(--g)/.5);color:var(--tx)}
.set input[type=range]{width:100%}
.sw{width:56px;height:30px;border-radius:8px;border:2px solid #fff;margin-right:8px}
#pre{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
#pre .btn{margin:0;padding:6px 8px;font-size:12px;text-align:left;border-radius:10px}
#pre .sw{display:block!important;width:100%!important;height:14px!important;margin:0 0 4px;border-radius:7px;border:1px solid rgb(255 255 255/.6)}
/* dock */
#dock{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:10px;padding:8px 12px;border-radius:24px;max-width:calc(100% - 16px)}
.ic{position:relative;flex:none;width:var(--dk,50px);height:var(--dk,50px);border-radius:calc(var(--dk,50px)/3.8);display:grid;place-items:center;font-size:calc(var(--dk,50px)/1.9);transition:transform .2s;box-shadow:0 4px 12px rgb(0 0 0/.25)}
.ic:hover{transform:translateY(-10px) scale(1.3)}
.ic.run:after{content:"";position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;background:var(--tx)}
#dock,#menu{transition:transform .8s}
.wallimg{position:fixed;inset:0;background-size:cover;background-position:center;transition:filter .3s}
.btn{cursor:pointer}
#clock,#wifi,#bat{white-space:nowrap}
#dicons{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:12px;align-items:center;z-index:1}
.di{position:relative;width:96px;padding:8px 4px 6px;border-radius:14px;text-align:center;cursor:pointer;outline:0;transition:background .2s,transform .2s}
.di:hover{transform:translateY(-3px)}.di.sel,.di:focus{background:rgb(255 255 255/.28)}
.di .f{position:relative;width:66px;height:54px;margin:6px auto 6px;border-radius:6px 10px 10px 10px;display:grid;place-items:center;font-size:28px;box-shadow:0 8px 18px rgb(0 0 0/.3),inset 0 1px 0 rgb(255 255 255/.5)}
.di .f:before{content:"";position:absolute;left:0;top:-7px;width:26px;height:9px;border-radius:6px 6px 0 0;background:inherit;filter:brightness(1.1)}
.di .lb{display:block;font-size:12.5px;font-weight:600;color:#fff;text-shadow:0 1px 4px rgb(0 0 0/.7)}
.di .x{position:absolute;top:0;right:4px;width:20px;height:20px;border-radius:50%;background:#ff5f57;color:#fff;font:700 10px/20px sans-serif;display:none;place-items:center;text-align:center;box-shadow:0 2px 6px rgb(0 0 0/.3)}
.di:hover .x,.di.sel .x{display:block}
#ov{position:fixed;left:0;right:0;bottom:0;top:calc(30px + env(safe-area-inset-top,0px));z-index:20;overflow:auto;padding:14px 32px 110px;background:linear-gradient(135deg,rgb(var(--g)/.62),rgb(var(--g)/.4));-webkit-backdrop-filter:blur(calc(var(--blur)*1.6)) saturate(180%);backdrop-filter:blur(calc(var(--blur)*1.6)) saturate(180%);clip-path:circle(0 at var(--cx,90%) var(--cy,10%));visibility:hidden;transition:clip-path .85s cubic-bezier(.7,0,.2,1),visibility .85s}
#ov.show{clip-path:circle(150% at var(--cx,90%) var(--cy,10%));visibility:visible}
.ovh{position:sticky;top:0;z-index:3;margin-bottom:8px;display:flex;align-items:center;gap:14px}
.tl3{display:flex;gap:8px;flex:none;padding:4px 2px}.tl3 i{position:relative;cursor:pointer;width:14px;height:14px;border-radius:50%;display:block}
.tl3 i:after{position:absolute;inset:0;display:grid;place-items:center;font:700 9px/14px sans-serif;color:rgb(0 0 0/.6);opacity:0;transition:opacity .15s}
.tl3:hover i:after{opacity:1}.tl3 .d1:after{content:"✕"}.tl3 .d2:after{content:"−"}.tl3 .d3:after{content:"+"}
#ovtt{flex:1;text-align:center;font-weight:600;margin-right:76px}
#ov{transition:clip-path .85s cubic-bezier(.7,0,.2,1),visibility .85s,top .5s,left .5s,right .5s,bottom .5s,border-radius .5s}
#ov.fw{top:calc(48px + env(safe-area-inset-top,0px));left:6%;right:6%;bottom:96px;border-radius:24px;border:1px solid var(--line);padding-bottom:30px}
#ov.fw .abw{min-height:0}
#ovb{padding:8px 18px;border-radius:99px;background:rgb(var(--g)/.6);border:1px solid var(--line);font-weight:600;transition:.2s}#ovb:hover{background:var(--a1);color:#fff;transform:translateX(-3px)}
.ovt{font-size:clamp(30px,4.5vw,52px);letter-spacing:-1.5px;line-height:1.1;margin:6px 0 12px}
.lead{font-size:17px;line-height:1.7}
.abw{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:44px;align-items:center;max-width:1150px;margin:0 auto;min-height:calc(100vh - 220px)}
.ab-l{text-align:center;animation:inL 1s .35s cubic-bezier(.2,1,.3,1) backwards}.ab-r{animation:inR 1s .45s cubic-bezier(.2,1,.3,1) backwards}
@keyframes inL{from{opacity:0;transform:translateX(-80px) scale(.9)}}@keyframes inR{from{opacity:0;transform:translateX(80px)}}
.av.bigav{width:min(320px,80%);height:auto;aspect-ratio:3/4;border-radius:38px;font-size:110px;margin:0 auto;animation:float 6s ease-in-out infinite;box-shadow:0 0 0 8px rgb(255 255 255/.18),0 30px 70px rgb(0 0 0/.35),0 0 90px var(--a1)}
@keyframes float{50%{transform:translateY(-12px)}}
.skg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;margin:22px auto 0;max-width:1150px}
.sk{position:relative;overflow:hidden;text-align:left;padding:22px;border-radius:22px;background:rgb(var(--g)/.42);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;transition:transform .35s cubic-bezier(.2,1.4,.4,1),box-shadow .35s,border-color .35s;animation:cardin .6s var(--d) backwards;--mx:50%;--my:50%}
@keyframes cardin{from{opacity:0;transform:translateY(34px) scale(.9)}}
.sk>*{position:relative;z-index:1}
.sk:before{content:"";position:absolute;inset:0;background:radial-gradient(190px circle at var(--mx) var(--my),rgb(255 255 255/.5),transparent 62%);opacity:0;transition:opacity .35s}
.sk:after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgb(255 255 255/.55),transparent);transform:skewX(-20deg);transition:left .8s}
.sk:hover{transform:translateY(-10px) scale(1.04);border-color:var(--a1);box-shadow:0 24px 46px rgb(0 0 0/.25),0 0 0 2px var(--a1)}
.sk:hover:before{opacity:1}.sk:hover:after{left:130%}
.se{font-size:42px;display:block;transition:transform .45s cubic-bezier(.2,1.6,.4,1)}.sk:hover .se{transform:scale(1.28) rotate(-9deg)}
.sk b{font-size:17px;margin-top:6px}.sk small{color:var(--tx2)}
.lv{display:block;height:6px;border-radius:6px;background:rgb(128 128 128/.25);overflow:hidden;margin-top:10px}.lv i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--a1),var(--a3));animation:fillw 1s .4s cubic-bezier(.2,1,.3,1) forwards}
@keyframes fillw{to{width:var(--w)}}
.g-projects{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.g-projects .sk{align-items:center;justify-content:flex-start;text-align:center;gap:8px;padding:30px 22px 22px;min-height:270px;animation:pjin .85s var(--d) cubic-bezier(.2,1.2,.3,1) backwards}
@keyframes pjin{from{opacity:0;transform:translateY(80px) scale(.78)}}
.g-projects .sk:hover{transform:translateY(-12px) scale(1.05)}
.g-projects .se{width:78px;height:78px;border-radius:26px;display:grid;place-items:center;font-size:38px;line-height:1;background:linear-gradient(135deg,rgb(var(--g)/.75),rgb(var(--g)/.25));border:1px solid var(--line);box-shadow:0 12px 26px rgb(0 0 0/.18),inset 0 1px 0 rgb(255 255 255/.6);transition:none}
.g-projects .sk:hover .se{transform:none}
.g-projects .sk b{font-size:18px;margin-top:8px}
.g-projects .sm{font-style:normal;color:var(--tx2);font-size:13.5px;line-height:1.55;flex:1}
.g-projects .tg{margin-top:6px;padding:4px 14px;border-radius:99px;background:rgb(var(--g)/.6);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--a1)}
.g-projects .go{font-size:13px;font-weight:700;color:var(--a1);opacity:0;transform:translateY(8px);transition:.35s;margin-top:4px}
.g-projects .sk:hover .go{opacity:1;transform:none}
.det{max-width:900px;margin:18px auto 0;padding:34px;border-radius:30px;background:rgb(var(--g)/.45);border:1px solid var(--line);animation:zin .6s cubic-bezier(.2,1.2,.3,1)}
@keyframes zin{from{opacity:0;transform:scale(.3)}}
.dh{display:flex;gap:22px;align-items:center;margin-bottom:16px}.de{font-size:84px;filter:drop-shadow(0 10px 20px rgb(0 0 0/.3));animation:float 5s ease-in-out infinite}
.det h1{font-size:clamp(28px,4vw,44px);letter-spacing:-1px}.det h4{margin:18px 0 6px}.det p{font-size:16px}
.lvb{height:12px;border-radius:12px;background:rgb(128 128 128/.25);overflow:hidden;margin:6px 0}.lvb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));border-radius:12px;animation:fillw 1.2s .3s cubic-bezier(.2,1,.3,1) forwards}
@media(max-width:800px){.abw{grid-template-columns:1fr;gap:24px}#ov{padding:12px 16px 110px}#dicons{top:8px;right:8px;gap:6px}.di{width:74px}}
#cc{position:fixed;top:calc(36px + env(safe-area-inset-top,0px));right:10px;width:340px;max-width:calc(100% - 20px);padding:18px;border-radius:26px;z-index:70;opacity:0;visibility:hidden;transform:translateY(-16px) scale(.82);transform-origin:90% 0;filter:blur(8px);transition:transform .55s cubic-bezier(.2,1.3,.35,1),opacity .3s,filter .4s,visibility .55s}
#cc.show{opacity:1;visibility:visible;transform:none;filter:none}
#cc>*{opacity:0;transform:translateY(14px)}
#cc.show>*{animation:ccu .55s cubic-bezier(.2,1.2,.4,1) forwards}
#cc.show>:nth-child(1){animation-delay:.08s}#cc.show>:nth-child(2){animation-delay:.16s}#cc.show>:nth-child(3){animation-delay:.24s}#cc.show>:nth-child(4){animation-delay:.32s}
@keyframes ccu{to{opacity:1;transform:none}}
.cc-time{display:flex;align-items:baseline;gap:4px;font-weight:700;letter-spacing:-3px}
#ct{font-size:68px;line-height:1;background:linear-gradient(135deg,var(--a1),var(--a2),var(--a3),var(--a1));background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{50%{background-position:100% 100%}}
.cc-time small{font-size:26px;letter-spacing:0;color:var(--tx2)}.cc-time em{font-style:normal;font-size:16px;letter-spacing:0;margin-left:6px;color:var(--tx2)}
.cc-date{color:var(--tx2);margin:2px 0 10px}
.cc-sec{height:5px;border-radius:5px;background:rgb(128 128 128/.25);overflow:hidden}.cc-sec i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--a1),var(--a3));transition:width 1s linear}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cc-tile{padding:14px;border-radius:18px;background:rgb(var(--g)/.4);border:1px solid var(--line)}
.cc-tile h5{font-size:14px;margin-top:8px;display:flex;justify-content:space-between}
.cc-tile p{font-size:12.5px;font-weight:600}.cc-tile small{color:var(--tx2);font-size:11.5px;display:block;line-height:1.35;margin-top:2px}
.wf{display:flex;align-items:flex-end;gap:3px;height:26px}.wf b{width:6px;border-radius:3px;background:var(--a1);opacity:.25;transition:.4s}.wf b:nth-child(1){height:7px}.wf b:nth-child(2){height:13px}.wf b:nth-child(3){height:19px}.wf b:nth-child(4){height:26px}.wf b.on{opacity:1}
#cc.show .wf b.on{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.bt{position:relative;width:46px;height:26px;border:2px solid var(--tx);border-radius:7px;padding:2px}.bt:after{content:"";position:absolute;right:-6px;top:6px;width:4px;height:8px;border-radius:0 3px 3px 0;background:var(--tx)}
.bt i{display:block;height:100%;width:0;border-radius:3px;background:#30d158;transition:width 1.2s cubic-bezier(.2,1,.3,1),background .4s}
.bt u{position:absolute;inset:0;display:none;place-items:center;text-decoration:none;font-size:13px}.bt.chg u{display:grid}
.cc-row{display:flex;gap:8px;margin-top:12px}.cc-row button{flex:1;padding:9px 4px;border-radius:14px;background:rgb(var(--g)/.4);border:1px solid var(--line);font-size:12px;transition:.2s}.cc-row button:hover{background:var(--a1);color:#fff;transform:translateY(-2px)}
#toast{position:fixed;top:calc(44px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:90;padding:8px 18px;border-radius:99px;display:none;white-space:nowrap}
body.pre #dock{transform:translate(-50%,140px)}body.pre #menu{transform:translateY(-50px)}
@media(max-width:700px){#dock{overflow-x:auto}.win{resize:none;min-width:0;left:8px!important;top:8px!important;width:calc(100% - 16px)!important;height:calc(100% - 96px)!important}.tb{cursor:default}.mh{display:none}.ic{width:44px;height:44px}}
#dock{padding:var(--dp,8px) 12px}
#menu{height:var(--mh,30px)}
#desk{inset:var(--mh,30px) 0 0}
#ov{top:calc(var(--mh,30px) + env(safe-area-inset-top,0px));background:linear-gradient(135deg,rgb(var(--g)/calc(var(--ovo,.5) + .12)),rgb(var(--g)/var(--ovo,.5)));-webkit-backdrop-filter:blur(var(--ovb,calc(var(--blur)*1.6))) saturate(180%);backdrop-filter:blur(var(--ovb,calc(var(--blur)*1.6))) saturate(180%)}
.dd{top:calc(var(--mh,30px) + 2px + env(safe-area-inset-top,0px))}
#cc{top:calc(var(--mh,30px) + 6px + env(safe-area-inset-top,0px))}
.card,.sk,.det{background:rgb(var(--cg,var(--g))/var(--co,.4));-webkit-backdrop-filter:blur(var(--cb,0px));backdrop-filter:blur(var(--cb,0px))}
.card{border-radius:var(--cr,14px)}.sk{border-radius:var(--cr,22px)}.det{border-radius:var(--cr,30px)}
.set textarea,.set select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:rgb(var(--g)/.5);color:var(--tx);font:inherit}
.tgd{margin:6px 0;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:rgb(var(--g)/.3)}.tgd summary{cursor:pointer;font-weight:600}
.set input[type=color]{width:46px;height:30px;border:0;background:none;padding:0;cursor:pointer;vertical-align:middle}
#dtxt{position:absolute;z-index:0;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;user-select:none;-webkit-user-select:none;cursor:grab;touch-action:none;max-width:86%}
